name: Release

# Push a tag like v0.1.0 (matching package.json) to publish that version to npm.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # lets npm record provenance: which commit and workflow built the package

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm publish --provenance --access public # prepublishOnly runs typecheck and tests
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
